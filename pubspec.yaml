name: ggw_connect
description: "GGW Connect — golf tournament and social networking app."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  get_it: ^8.0.3
  equatable: ^2.0.5
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/golf_logo2.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/golf_logo2.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icons/golf_logo2.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/golf_logo2.png
    - assets/pics/people/
    - assets/pics/field/
    - assets/pics/equipments/

  fonts:
    - family: Schuyler
      fonts:
        - asset: assets/font/Outfit-Medium.ttf
    - family: DMSans
      fonts:
        - asset: assets/font/DMSans-Medium.ttf
