name: ggw_connect
description: "GGW Connect — golf tournament and social networking app."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  get_it: ^8.0.3
  equatable: ^2.0.5
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  # Used only by tool/prepare_launcher_icons.dart to pad the master logo into
  # the adaptive-icon safe zone.
  image: ^4.3.0

flutter_launcher_icons:
  android: true
  ios: true
  # Sources are generated by tool/prepare_launcher_icons.dart from the master
  # logo (assets/icons/ggw_connect_logo.png). They are pre-padded so the badge's
  # rim text survives Android's adaptive-icon crop — don't point these at the
  # full-bleed master or the lettering gets clipped again.
  image_path: "assets/icons/ic_launcher.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/ic_launcher_foreground.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icons/ic_launcher.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/golf_logo2.png
    - assets/pics/people/
    - assets/pics/field/
    - assets/pics/equipments/

  fonts:
    - family: Schuyler
      fonts:
        - asset: assets/font/Outfit-Medium.ttf
    - family: DMSans
      fonts:
        - asset: assets/font/DMSans-Medium.ttf
